<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Magenta Glow Filter -->
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="cyber-cyan-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#7B00FF" />
      <stop offset="100%" stop-color="#FF00FF" />
    </linearGradient>

    <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>

    <linearGradient id="neon-mag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF00FF" />
      <stop offset="100%" stop-color="#D9006C" />
    </linearGradient>
  </defs>

  <!-- Dark Tactical Background Frame (0px sharp corners) -->
  <rect x="2" y="2" width="60" height="60" fill="#090d1d" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Inner Grid Lines -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#00FFFF" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="2,2" />
  <line x1="32" y1="2" x2="32" y2="62" stroke="#FF00FF" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="2,2" />

  <!-- Corner Brackets (Tactical UI) -->
  <path d="M 2 12 L 2 2 L 12 2" fill="none" stroke="#00FFFF" stroke-width="2.5" stroke-linecap="square" />
  <path d="M 62 12 L 62 2 L 52 2" fill="none" stroke="#00FFFF" stroke-width="2.5" stroke-linecap="square" />
  <path d="M 2 52 L 2 62 L 12 62" fill="none" stroke="#FF00FF" stroke-width="2.5" stroke-linecap="square" />
  <path d="M 62 52 L 62 62 L 52 62" fill="none" stroke="#FF00FF" stroke-width="2.5" stroke-linecap="square" />

  <!-- Cyber 'SZ' Isometric Monogram Motif -->
  <!-- Top Bar (Neon Cyan) -->
  <polygon points="14,14 48,14 42,20 18,20" fill="url(#neon-cyan-grad)" filter="url(#glow-cyan)" />
  
  <!-- Diagonal Slash Connector (Dual Lit Gradient) -->
  <polygon points="48,14 42,20 22,44 16,44" fill="url(#cyber-cyan-magenta)" />
  <polygon points="42,20 48,20 28,44 22,44" fill="#00FFFF" opacity="0.8" />
  
  <!-- Bottom Bar (Neon Magenta) -->
  <polygon points="16,44 46,44 50,50 20,50" fill="url(#neon-mag-grad)" filter="url(#glow-magenta)" />

  <!-- Tactical Core Node / Terminal Status Pulse (Plasma Green) -->
  <rect x="46" y="32" width="5" height="5" fill="#80FF00" />
  <circle cx="48.5" cy="34.5" r="4.5" fill="none" stroke="#80FF00" stroke-width="0.8" opacity="0.6" />

  <!-- Command Line Indicator Arrow > -->
  <path d="M 15 28 L 21 32 L 15 36" fill="none" stroke="#00FFFF" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" />
</svg>