services:
  cyber-architect-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber_architect_production
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SQLITE_DB_PATH=/app/data/portfolio.sqlite
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-cyber_architect_prod_secret_token_1337}
    volumes:
      # Persistent SQLite WAL database and backup storage
      - portfolio_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  portfolio_data:
    driver: local
